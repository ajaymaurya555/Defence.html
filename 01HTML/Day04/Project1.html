<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
        <h1>University Registration Form </h1>
        <p>Please fill out the Form Blew to register.</p>
        <hr>


        <form>
            <h2>Personal Details</h2>
             
            <label for="First Name">First Name:</label>
            <input type="text" name="Name" id="First Name" placeholder="e.g Ajay">

            <br><br>

            <label for="surname" >Last Name:</label>
            <input type="text" name="surname" id="surname" placeholder="e.g Kunar Maurya">

            <br><br>

            <label for="DOB">Date of Birth:</label>
            <input type="date" name="D.O.B" id="DOB">

            <br><br>

            <h3>Gender:</h3>

            <label for="Male">Male:</label>
            <input type="radio" name="Gender" id="Male">

            <br><br>

            <label for="female">Female:</label>
            <input type="radio" name="Gender" id="female">

            <br><br>

            <label for="other">Other:</label>
            <input type="radio" name="Gender" id="other">

            <h3>Upload Your File:</h3>
            <input type="file" name="File">
            <hr>
            <h3>Contect Information </h3>

            
            <label for="E-address">Email-Address:</Email-Address></label>
            <input type="email" name="Email-Address" id="E-address" placeholder="e.g. ajaymaurya555aa@gmail.com">


            <br><br>

            <label for="Phone">phone Number:</label>
            <input type="number" name="Phone" id="Phone" placeholder=" e.g. 9555822414">

            <br><br>

            <label for="address">Milling Address:</label>
            <br>
            <textarea name="address" id="address" rows="10" cols="20" placeholder="e.g. Street Address,City,State,zip code"></textarea> 

            <hr>

            <h3>Acadamic Address</h3>

            <label for="course"> Select Your Course </label>
            <select name="course" id="course">
                <option value="CSE">CSE</option>
                <option value="ME">ME</option>
                <option value="CE">CE</option>
            </select>

            <h3>Extracurricular interest</h3>

            <label for="Sports">Sports</label>
            <input type="radio" name="interest" id="Sports">

            <br><br>

            <label for="Music">Music & Art </label>
            <input type="radio" name="interest" id="Music">

            <br><br>

            <label for="Technology">Technology Clubs</label>
            <input type="radio" name="interest" id="Technology">

            <br><br>

            <label for="voluntering">voluntering</label>
            <input type="radio" name="interest" id="voluntering">

            <br><br>
            <hr>

            <h3>Create your account</h3>

            <label for="password">Create your password :</label>
            <input type="password" name="password" id="password">

            <br><br>
            <label for="secu">Security Questions :</label>

            <select name="secu" id="secu">
                <option id="pet" name="secu">What was your first pet Name ?</option>
                <option id="School" name="secu">What was your first School Name ?</option>
                <option id="Colour" name="secu">What is your Favurate Colour?</option>
                <option id="Teacher" name="secu">What is your fevurate Teacher Name ?</option>
            </select>

            <br><br>

        <label for="secu Ans">Security Answer:</label>
        <input type=" text" name="Security Ans" id="secu Ans">
            
            <br><br>



        <input type="checkbox" id="Condition" name="Condition">   
        <label for="Condition">I agree to the terms and Condition. </label>

        <hr>

        <button form="Register">Register</button>
        <button form="Clear form">Clear form</form></button>


        

                








         

            



        



        


            
            
            
            
            

            


          

            







        </form>
</body>
</html>
